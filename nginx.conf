server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve static assets with cache-control headers
    location ~* \.(js|css|html|svg|ico|png|jpg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Fallback: always serve index.html (handles direct URL loads)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header Referrer-Policy         "no-referrer"     always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline'; frame-src *;" always;

    # Disable nginx version in error pages
    server_tokens off;

    # Gzip static assets
    gzip            on;
    gzip_types      text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
